[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pci"
version = "0.1.0"
description = "Personal Content Index"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "sqlite-vec",
    "anthropic",
    "openai",
    "sentence-transformers",
    "lightrag-hku",
    "trafilatura",
    "pypdf",
    "yt-dlp[default]",
    "webvtt-py",
    "sqlean.py",
    "python-dotenv>=1.2.2",
    "aiohttp",
    "tqdm",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
]

[project.scripts]
pci = "pci.cli:app"

[tool.setuptools.packages.find]
include = ["pci", "pci.*"]
