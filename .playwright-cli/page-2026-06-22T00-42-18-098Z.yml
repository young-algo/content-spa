          - paragraph [ref=e755]: The EU AI Act creates strict obligations for high-risk AI systems, including risk management, data quality, logging, documentation, deployer information, human oversight, robustness, cybersecurity, and accuracy. It also treats certain biometric, employment, education, and medical-software uses as sensitive or high-risk depending on intended purpose. Nike should design Athlete Intelligence to meet high-risk standards before regulators or athlete associations force the issue.
