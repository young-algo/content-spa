          - paragraph [ref=e178]: The competitor proof is already visible. WHOOP offers 24/7 monitoring across sleep, strain, stress, and heart health, with membership tiers starting at $199/year; WHOOP Coach uses GPT-4 to deliver personalized health and fitness coaching from biometric data. Apple Fitness+ charges $9.99/month or $79.99/year, and Strava’s U.S. subscription is listed at $11.99/month or $79.99/year.
          - paragraph [ref=e179]: Nike’s opportunity is to be broader than WHOOP, more sport-specific than Apple, more coachable than Strava, and more trusted by athletes than data brokers or team-surveillance vendors.
