      - generic [ref=e90]:
        - heading "Summary" [level=2] [ref=e91]
        - paragraph [ref=e92]: "Nike should build Athlete Intelligence, a privacy-first AI platform that helps athletes understand, improve, verify, and monetize their performance, positioning itself as Nike's intelligence layer for sport rather than a fitness app or wearable. By 2030, this recurring-revenue business could generate $3-5 billion annually through five product lines: Nike Coach+ (consumer AI coaching), Nike Performance Cloud (team SaaS), Nike Athlete Passport (verified athletic identity and data wallet), Nike Virtual Athlete Studio (licensed digital athlete content), and Nike Intelligence Exchange (privacy-preserving APIs). Success requires treating athlete data as a trust asset rather than an advertising or resale asset, with governance commitments including no raw data resale, purpose-bound consent, human oversight for high-stakes decisions, and athlete royalties for licensed content."
