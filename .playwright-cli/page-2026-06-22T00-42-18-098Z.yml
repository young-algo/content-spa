          - heading "NIKE Athlete Intelligence by 2030" [level=2] [ref=e104]:
            - strong [ref=e105]: NIKE Athlete Intelligence by 2030
          - heading "Executive thesis" [level=3] [ref=e106]
          - paragraph [ref=e107]:
            - text: Nike should build a new recurring-revenue business called
            - strong [ref=e108]: Athlete Intelligence
            - text: ": a privacy-first AI platform that helps athletes understand, improve, verify, and monetize their athletic performance. This should not be positioned as a fitness app, a wearable, a data brokerage, or a Web3 reboot. It should be positioned as"
            - strong [ref=e109]: Nike’s intelligence layer for sport
            - text: .
          - paragraph [ref=e110]:
            - text: By 2030, Athlete Intelligence can plausibly become a
            - strong [ref=e111]: $3–5 billion annual revenue business
            - text: "from software subscriptions, team SaaS, athlete data-wallet services, rights-cleared digital athlete products, enterprise wellness, events, and developer/API licensing. The strategic value is larger than the revenue: it would move Nike from selling products around athletic identity to operating the trusted system that understands athletic identity."
          - paragraph [ref=e112]: "The attached reports support the market logic: AI in sports is already moving from isolated analytics into coaching, biomechanics, digital twins, automated media, athlete rights, and fan-personalization infrastructure, while the highest-risk applications remain athlete health, employment, biometric use, and data ownership."
          - paragraph [ref=e113]: Nike needs this because the current business is still heavily exposed to physical-product cycles, channel mix, tariffs, discounting, and digital-commerce volatility. In FY2025, Nike reported $46.3 billion of revenue, down 10% reported, while Nike Direct revenue declined 13% and Nike Brand Digital declined 20%; in Q3 FY2026, Nike Direct revenue was $4.5 billion, down 7% currency-neutral, with Nike Brand Digital down 9% and gross margin at 40.2%.
          - paragraph [ref=e114]:
            - text: "The board-level question is not “Can Nike add AI to its apps?” The question is:"
            - strong [ref=e115]: Can Nike create the dominant trusted intelligence business for the world’s athletes before Apple, WHOOP, Strava, sports-tech SaaS vendors, and AI-native coaching startups fragment the market?
          - paragraph [ref=e116]:
            - text: "My answer:"
            - strong [ref=e117]: yes, if Nike treats athlete data as a trust asset, not an advertising asset.
          - separator [ref=e118]
          - heading "1. The board narrative" [level=2] [ref=e119]
          - heading "The pitch in one sentence" [level=3] [ref=e120]
          - paragraph [ref=e121]:
            - strong [ref=e122]: "Nike should become the operating system for athletic potential: the platform that understands how athletes move, coaches them daily, verifies their performance identity, protects their data rights, and creates new revenue from intelligence rather than inventory."
          - heading "The board-room version" [level=3] [ref=e123]
          - paragraph [ref=e124]: "Nike has spent decades building the world’s most powerful athletic brand. It has also built an under-monetized digital asset: a global relationship with athletes through Nike Membership, Nike App, Nike Run Club, Nike Training Club, SNKRS, retail, events, sponsored athletes, sport-science research, product fit, and performance data."
          - paragraph [ref=e125]:
            - text: Today, that relationship is still monetized primarily through shoes, apparel, and equipment. By 2030, it should also be monetized through
            - strong [ref=e126]: AI-powered intelligence products
            - text: ":"
          - list [ref=e127]:
            - listitem [ref=e128]:
              - strong [ref=e129]: Nike Coach+
              - text: for consumers.
            - listitem [ref=e130]:
              - strong [ref=e131]: Nike Performance Cloud
              - text: for teams, schools, academies, and clubs.
            - listitem [ref=e132]:
              - strong [ref=e133]: Nike Athlete Passport
              - text: for verified performance, recruiting, NIL, and athlete-owned data.
            - listitem [ref=e134]:
              - strong [ref=e135]: Nike Virtual Athlete Studio
              - text: for licensed athlete digital twins, training content, gaming, and media.
            - listitem [ref=e136]:
              - strong [ref=e137]: Nike Intelligence Exchange
              - text: for privacy-preserving APIs, race/event intelligence, corporate wellness, and partner ecosystems.
          - paragraph [ref=e138]:
            - text: The goal is not to sell personal data. The goal is to sell
            - strong [ref=e139]: outcomes
            - text: ": better coaching, better adherence, better readiness, better scouting, better athlete control, better fan/media experiences, and better sport participation."
